name: CI

on: [push, pull_request]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version '^2' --locked

      - name: Enable pnpm (used by tauri.conf beforeBuildCommand)
        run: corepack enable && corepack prepare pnpm@9.15.0 --activate

      # frontendDist (../dist) debe existir antes de cualquier cargo build/test,
      # porque tauri::generate_context!() lo valida en tiempo de compilacion.
      - name: Frontend build
        run: npm ci && npm run build

      - name: Backend tests
        working-directory: src-tauri
        run: cargo test

      - name: Backend release build
        working-directory: src-tauri
        run: cargo build --release

      # --- macOS: bundles arm64 (default del runner) y x86_64 (Intel) ---
      - name: Add Intel target
        if: matrix.os == 'macos-latest'
        run: rustup target add x86_64-apple-darwin

      - name: Tauri bundle (arm64)
        if: matrix.os == 'macos-latest'
        working-directory: src-tauri
        run: cargo tauri build

      - name: Tauri bundle (x86_64)
        if: matrix.os == 'macos-latest'
        working-directory: src-tauri
        run: cargo tauri build --target x86_64-apple-darwin

      - name: Upload macos arm64 bundle
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: NominaMX-macos-arm64
          path: src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error

      - name: Upload macos x86_64 bundle
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: NominaMX-macos-x86_64
          path: src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error

      # --- Windows: sin cambios (solo .msi) ---
      - name: Tauri bundle (.msi on Windows)
        if: matrix.os == 'windows-latest'
        working-directory: src-tauri
        run: cargo tauri build

      - name: Upload windows bundle
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: NominaMX-windows-latest
          path: src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: warn
