[package]
name = "nomina-mx"
version = "0.1.0"
description = "NominaMX - Administracion de nomina mexicana"
authors = ["NominaMX"]
edition = "2021"

[lib]
name = "nomina_mx_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "chrono"] }
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
# C2: lectura de CSV y decodificación UTF-8 con fallback Latin-1 (Windows-1252).
csv = "1"
encoding_rs = "0.8"

[dev-dependencies]
quick-xml = { version = "0.36", features = ["serialize"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
